name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - featureBranchNo1
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  lint-bandit:
    name: Python Security Linting (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r . --severity-level high || exit 1

  scan-codeql:
    name: Static Code Analysis (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3


  scan-trivy:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y
      - name: Scan Dockerfile
        run: trivy config .

  build-feature:
    name: Build Feature Branch
    runs-on: ubuntu-latest
    needs: [lint-bandit, scan-codeql, scan-trivy]
    if: github.ref == 'refs/heads/featureBranchNo1'
    steps:
      - uses: actions/checkout@v4
      - name: Build Feature Branch
        run: |
          echo "Building featureBranchNo1..."
          make build

  notify-approval:
    name: Request Approval via Email
    runs-on: ubuntu-latest
    needs: build-feature
    if: github.ref == 'refs/heads/featureBranchNo1'
    steps:
      - name: Send Email for Approval
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.example.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Approval Needed: featureBranchNo1 Build Passed"
          to: ashwani07.mishra@outlook.com
          from: CI Bot <ashwani07.mishra@outlook.com>
          body: |
            The build for featureBranchNo1 was successful.
            Please review and approve to proceed with main branch build.

  build-main:
    name: Build Main Branch
    runs-on: ubuntu-latest
    needs: notify-approval
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Main Branch
        run: |
          echo "Building main branch..."
          make build